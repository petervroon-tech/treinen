[package]
name = "treinen"
version = "1.0.0"
edition = "2021"
authors = ["Treinen WASM Team"]
description = "Cross-platform WebAssembly treinsimulatie voor het Nederlandse spoornetwerk"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
